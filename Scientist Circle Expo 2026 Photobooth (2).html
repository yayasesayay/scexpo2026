<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scientist Circle Expo 2026 Photobooth</title>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a3d5f;--bg2:#0f4d75;--ink:#f4f9fc;--accent:#8fd0f5;--line:#2a7bab;--btn:#f4f9fc;--btnink:#0a3d5f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#072e48;--bg2:#0c3b5c}}
:root[data-theme="dark"]{--bg:#072e48;--bg2:#0c3b5c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;min-height:100vh}
header{text-align:center;padding:28px 16px 8px}
h1{font-family:'Young Serif',Georgia,serif;font-weight:400;font-size:clamp(2.2rem,9vw,4rem);margin:0;letter-spacing:.01em;color:var(--accent);text-shadow:2px 2px 0 #041a2b}
header p{margin:6px 0 0;opacity:.8}
main{max-width:980px;margin:0 auto;padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
@media(max-width:760px){main{grid-template-columns:1fr}}
.panel{background:var(--bg2);border:2px solid var(--line);border-radius:20px;padding:16px}
.cam{position:relative;aspect-ratio:4/3;background:#082c45;border-radius:14px;overflow:hidden}
video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block}
#count{position:absolute;inset:0;display:grid;place-items:center;font-family:'Young Serif',Georgia,serif;font-size:7rem;color:#fff;text-shadow:0 4px 20px #0008;pointer-events:none}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .35s}
#msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;opacity:.9}
h2{font-size:1rem;margin:16px 0 8px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:transparent;color:var(--ink);padding:7px 14px;border-radius:99px;font:inherit;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--btnink);border-color:var(--accent);font-weight:600}
.btn{border:0;background:var(--btn);color:var(--btnink);font:inherit;font-weight:600;padding:12px 20px;border-radius:14px;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.chip:focus-visible{outline:3px solid #fff;outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
#out{display:block;width:100%;max-width:340px;margin:0 auto;border-radius:6px;box-shadow:0 10px 30px #0006;background:#082c45}
.gal{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.gal img{height:130px;border-radius:6px;cursor:pointer;border:2px solid var(--line)}
.hint{font-size:.85rem;opacity:.75;margin:10px 0 0;text-align:center}
@media(prefers-reduced-motion:reduce){#flash{transition:none}}
</style>
</head>

const cv=$('out'),cx=cv.getContext('2d'),vid=$('vid');
const W=600,H=1900,PX=40,PW=520,PH=390,GAP=24,TOP=40;

function chips(el,items,get,set){
  items.forEach(n=>{const b=document.createElement('button');b.className='chip';b.textContent=n;b.onclick=()=>{set(n);[...el.children].forEach(c=>c.setAttribute('aria-pressed',c===b));draw();setPrev()};b.setAttribute('aria-pressed',n===get());el.appendChild(b)});
}
chips($('filters'),Object.keys(FILTERS),()=>filter,n=>{filter=n});
chips($('frames'),FRAMES,()=>frame,n=>{frame=n});
function setPrev(){vid.style.filter=FILTERS[filter]}

function heart(x,y,s,c){cx.save();cx.translate(x,y);cx.strokeStyle=c;cx.fillStyle=c;cx.lineWidth=3;cx.beginPath();cx.arc(0,0,s*.35,0,7);cx.fill();cx.beginPath();cx.moveTo(0,0);cx.lineTo(s*.9,-s*.5);cx.stroke();cx.beginPath();cx.arc(s*.9,-s*.5,s*.22,0,7);cx.stroke();cx.restore()}

const DIV={'Mentoring IPAS':{n:'Mentoring IPAS',bg:'#e0f5ea',acc:'#01a456',p:'atom'},'Competition':{n:'Competition',bg:'#f1e4f8',acc:'#7000a4',p:'star'},'Event':{n:'Event',bg:'#eceff3',acc:'#5f6168',p:'conf'},'Webinering':{n:'Webinering',bg:'#ddf6fb',acc:'#0bb4d6',p:'pix'}};
function divBg(d){
  cx.fillStyle=d.bg;cx.fillRect(0,0,W,H);cx.fillStyle=d.acc;cx.strokeStyle=d.acc;cx.lineWidth=3;
  for(let i=0;i<54;i++){
    const x=((i*97)%100)/100*W,y=((i*53)%100)/100*1660+10,s=10+(i%4)*5;
    cx.save();cx.translate(x,y);cx.rotate(i*1.7);
    if(d.p==='atom'){cx.beginPath();cx.ellipse(0,0,s*1.4,s*.6,0,0,7);cx.stroke();cx.beginPath();cx.arc(0,0,s*.3,0,7);cx.fill()}
    else if(d.p==='star'){cx.beginPath();for(let k=0;k<10;k++){const r=k%2?s*.45:s,a=k*Math.PI/5;cx.lineTo(Math.sin(a)*r,-Math.cos(a)*r)}cx.closePath();cx.fill()}
    else if(d.p==='conf'){cx.fillRect(-s*.5,-s*.2,s,s*.4)}
    else{cx.fillRect(-s*.4,-s*.4,s*.8,s*.8);if(i%3==0){cx.strokeRect(-s*.8,-s*.8,s*1.6,s*1.6)}}
    cx.restore();
  }
  cx.fillStyle='#fdfaf3';cx.fillRect(0,1688,W,H-1688);
}
function bg(){
  cx.filter='none';
  if(frame==='Biru SC'){cx.fillStyle='#0a3d5f';cx.fillRect(0,0,W,H);cx.strokeStyle='#8fd0f5';cx.lineWidth=4;cx.setLineDash([14,10]);cx.strokeRect(14,14,W-28,H-28);cx.setLineDash([])}
  else if(DIV[frame]){divBg(DIV[frame])}
  else if(frame==='Kertas'){cx.fillStyle='#f4f9fc';cx.fillRect(0,0,W,H)}
  else if(frame==='Polkadot'){cx.fillStyle='#f4f9fc';cx.fillRect(0,0,W,H);cx.fillStyle='#0074b1';for(let r=0,y=18;y<H;y+=44,r++)for(let x=(r%2)*28+14;x<W;x+=56){cx.beginPath();cx.arc(x,y,12,0,7);cx.fill()}cx.fillStyle='#f4f9fc';cx.fillRect(0,1688,W,H-1688)}
  else if(frame==='Molekul'){cx.fillStyle='#8fd0f5';cx.fillRect(0,0,W,H);for(let i=0;i<46;i++){const r=(i*97)%100/100,q=(i*53)%100/100;heart(r*W,q*H,16+(i%4)*8,i%2?'#2a7bab':'#ffffff88')}}
  else{cx.fillStyle='#06243a';cx.fillRect(0,0,W,H);cx.fillStyle='#f4f9fc';for(let y=20;y<H;y+=44){cx.fillRect(10,y,16,24);cx.fillRect(W-26,y,16,24)}}
}
function footer(){
  const dark=!!DIV[frame]||frame==='Kertas'||frame==='Molekul'||frame==='Polkadot';
  const cy=H-114,tx=222;
  cx.filter='none';cx.textAlign='left';
  const LG=LOGOS[frame]||LOGO;if(LG.complete&&LG.naturalWidth){const k=Math.min(150/LG.naturalWidth,150/LG.naturalHeight),lw=LG.naturalWidth*k,lh=LG.naturalHeight*k;cx.drawImage(LG,50+(150-lw)/2,cy-lh/2,lw,lh)}
  cx.fillStyle=dark?'#0a3d5f':'#8fd0f5';
  cx.font='38px "Young Serif",Georgia,serif';
  cx.fillText('Scientist Circle',tx,cy-38);
  cx.font='600 '+(DIV[frame]?22:24)+'px "DM Sans",sans-serif';
  cx.fillText(DIV[frame]?'Expo 2026 | '+DIV[frame].n:'Expo 2026',tx,cy-8);
  cx.font='italic 18px "DM Sans",sans-serif';
  cx.fillText('Light Up Your World',tx,cy+18);
  cx.fillText('With Your Innovation',tx,cy+40);
  cx.font='17px "DM Sans",sans-serif';cx.globalAlpha=.85;
  cx.fillText('@scientistcircle_',tx,cy+66);cx.globalAlpha=1;
}
function draw(){
  bg();
  const fx=frame==='Film'?58:PX, fw=frame==='Film'?W-116:PW, fh=Math.round(fw*.75);
  for(let i=0;i<4;i++){
    const y=TOP+i*(PH+GAP);
    const h=frame==='Film'?PH:PH, w=frame==='Film'?W-116:PW;
    const s=shots[i];
    if(s){
      cx.save();cx.beginPath();cx.rect(fx,y,w,h);cx.clip();cx.filter=FILTERS[filter];
      const sc=Math.max(w/s.width,h/s.height);const dw=s.width*sc,dh=s.height*sc;
      cx.drawImage(s,fx+(w-dw)/2,y+(h-dh)/2,dw,dh);cx.restore();
    }else{cx.filter='none';cx.fillStyle='#0003';cx.fillRect(fx,y,w,h)}
    if(DIV[frame]){cx.filter='none';cx.strokeStyle=DIV[frame].acc;cx.lineWidth=10;cx.strokeRect(fx,y,w,h)}
    if(frame==='Kertas'||frame==='Molekul'||frame==='Polkadot'){cx.filter='none';cx.strokeStyle=frame==='Molekul'?'#fff':frame==='Polkadot'?'#0074b1':'#0a3d5f';cx.lineWidth=frame==='Molekul'?8:frame==='Polkadot'?10:3;cx.strokeRect(fx,y,w,h)}
  }
  footer();
  const done=shots.length===4&&!busy;
  $('save').disabled=!done;$('keep').disabled=!done;
}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
async function snap(){
  const c=document.createElement('canvas');c.width=vid.videoWidth;c.height=vid.videoHeight;
  const g=c.getContext('2d');g.translate(c.width,0);g.scale(-1,1);g.drawImage(vid,0,0);
  const f=$('flash');f.style.opacity=.9;setTimeout(()=>f.style.opacity=0,80);
  return c;
}
async function run(){
  if(busy)return;busy=true;shots=[];draw();
  $('go').disabled=true;$('reset').disabled=true;$('hint').textContent='Siap-siap, senyum!';
  for(let i=0;i<4;i++){
    for(let n=3;n>0;n--){$('count').textContent=n;await sleep(900)}
    $('count').textContent='';
    shots.push(await snap());draw();await sleep(500);
  }
  busy=false;draw();
  $('go').disabled=false;$('go').textContent='Foto lagi';$('reset').disabled=false;
  $('hint').textContent='Selesai! Ganti filter atau frame kapan saja sebelum menyimpan.';
}
$('go').onclick=run;
$('reset').onclick=()=>{shots=[];draw();$('reset').disabled=true;$('go').textContent='Mulai foto';$('hint').textContent='Fotomu muncul di sini setelah sesi dimulai.'};

function toBlob(type,q,canvas){return new Promise(r=>(canvas||cv).toBlob(r,type,q))}
async function saveFile(blob,name){
  try{
    const d=await claude.use('downloads');
    if(d){await d.save({filename:name,data:new Uint8Array(await blob.arrayBuffer())});return}
  }catch(e){if(e&&e.code==='declined')return}
  // fallback: open image so it can be long-pressed / right-clicked to save
  const u=URL.createObjectURL(blob);window.open(u,'_blank');
  $('hint').textContent='Tekan dan tahan (atau klik kanan) gambar yang terbuka untuk menyimpan.';
}
$('save').onclick=async()=>saveFile(await toBlob('image/png'),'scientistcircle-'+Date.now()+'.png');

function loadGal(){try{return JSON.parse(localStorage.getItem('sc-gal')||'[]')}catch(e){return[]}}
function renderGal(){
  const g=loadGal(),el=$('gal');el.innerHTML='';
  $('galhint').style.display=g.length?'none':'block';
  g.forEach(u=>{const i=new Image();i.src=u;i.alt='Foto tersimpan';i.onclick=async()=>{const b=await (await fetch(u)).blob();saveFile(b,'scientistcircle-'+Date.now()+'.jpg')};el.appendChild(i)});
}
$('keep').onclick=()=>{
  const s=document.createElement('canvas');s.width=300;s.height=950;s.getContext('2d').drawImage(cv,0,0,300,910);
  let g=loadGal();g.unshift(s.toDataURL('image/jpeg',.8));g=g.slice(0,6);
  try{localStorage.setItem('sc-gal',JSON.stringify(g));$('hint').textContent='Tersimpan di galeri (hanya di browser ini).'}
  catch(e){$('hint').textContent='Galeri penuh atau tidak tersedia. Pakai tombol Simpan foto.'}
  renderGal();
};

async function cam(){
  try{
